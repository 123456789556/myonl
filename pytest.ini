[pytest]
# 只收集本引擎测试；p30-renpy-ref/ 是参考源码（含 Ren'Py 自带 unittest），不参与收集
testpaths = tests
norecursedirs = p30-renpy-ref build dist .git __pycache__
addopts = --strict-markers
markers =
    unit: 纯逻辑/无窗口测试（parser、expr、config、save 等）
    ui: 需要 pygame 无头渲染（SDL_VIDEODRIVER=dummy）的渲染/页面测试
    slow: 全量渲染驱动、打包、性能基准，或单个用例耗时 >2s
    integration: 跨模块端到端（demo 主循环、editor 桥接、打包产物等）
