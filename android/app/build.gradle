plugins {
    id 'com.android.application'
}

android {
    namespace 'net.myonl.player'
    compileSdk 34

    defaultConfig {
        applicationId "net.myonl.player"
        minSdk 24
        targetSdk 34
        // 版本号不许再写死：写死的后果是每个包 system 都当"同一版"，
        // 覆盖安装时行为不可控，用户也看不出自己更新了没有。
        // CI 从 tag 推导后传进来（v1.1.0 -> 1.0.0 的 versionName + 10100 的 versionCode）。
        versionCode = (System.getenv("MYONL_VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("MYONL_VERSION_NAME") ?: "1.0.0"
    }

    // 签名：私钥不进仓库（见 .gitignore 里 android/keystore/ 那段）。
    //
    // 以前这里挂着 p12 + 明文密码的兜底，理由是「换签名玩家要卸载，localStorage 会跟着删」。
    // 那个权衡是错的：私钥公开 = 任何人都能签一个包名和签名都相同的 APK，
    // 覆盖装在已经装了正版的手机上，把作品全带走。代价一次卸载，风险是全部数据。
    //
    // 现在私钥留本地 / 放 CI secret，签名本身没换 —— 签出来还是同一个，
    // 老用户照常覆盖升级，不用卸载。
    //
    //   本地：p12 放 android/keystore/，MYONL_STORE_PASS / MYONL_KEY_PASS 设进环境变量
    //   CI  ：从 repository secret 还原 p12 再传同样的变量
    // 三样缺一个就不签，出的包会明确标未签名 —— 不偷偷签个装不上的废包。
    def ksFile = file(System.getenv("MYONL_KEYSTORE") ?: "../keystore/myonl-test.p12")
    def storePass = System.getenv("MYONL_STORE_PASS")
    def keyPass = System.getenv("MYONL_KEY_PASS") ?: storePass
    def canSign = ksFile.exists() && storePass?.trim() && keyPass?.trim()

    signingConfigs {
        release {
            if (canSign) {
                storeFile ksFile
                storePassword storePass
                keyAlias System.getenv("MYONL_KEY_ALIAS") ?: "myonl"
                keyPassword keyPass
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (canSign) { signingConfig signingConfigs.release }
        }
        debug {
            if (canSign) { signingConfig signingConfigs.release }
        }
    }

    if (!canSign) {
        logger.warn("MYONL: 没有可用签名（p12 或密码缺失），出的是未签名包，装不上。")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
