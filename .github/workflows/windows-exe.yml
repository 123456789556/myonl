name: 桌面 exe

# P214：以前 workflows 里一条打 exe 的都没有 —— 桌面版只能本机手搓 build_editor.bat，
# 于是 APK 一路 v1.2.x 自动发，exe 停在 v1.0.0-rc19，两端版本号对不上。
# 这条与 android-apk.yml 并列，同一个 tag 推上来两边一起出包，落到同一个 Release。
#
# 触发：推 v* tag（与 APK 同步），或 Actions 手动跑一条探路包。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 40

    # Windows runner 的控制台代码页不是 UTF-8，Python 默认按 cp1252 写 stdout，
    # 脚本里任何一句中文 print 都会 UnicodeEncodeError 把构建搞红。
    # 脚本自己 reconfigure 是第一道，这里再兜一层 —— 别让打印毁掉打包。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      # 3.11 是 pygame-ce / pyinstaller / pywebview 三方都稳的一档。
      # 用 3.13 会踩「pythonnet 还没跟上」那类包不可装的问题，不值得赌。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 先拦版本不一致的 tag，再花 10 分钟编译 —— 顺序反了就是白等。
      # 真源只有一个：engine/_version.py 的 VERSION。tag 必须与它完全一致。
      #
      # 注意：这里**不要**用 `python -c "import engine._version"` 取版本。
      # `import engine._version` 会先执行包初始化 engine/__init__.py，它 import 了
      # pygame，pygame 启动时打印一行 banner —— stdout 变成两行，比对必挂。
      # （v1.2.33 首次跑这条就是这么红的。）直接读文件里的那一行最稳。
      - name: 校验 tag 与 engine/_version.py 一致
        shell: pwsh
        run: |
          # 注意 `Select-Object -First 1`：Where-Object 返回的是字符串数组，
          # 对数组直接取 [0] 在 pwsh 里拿的是「第一个字符」（'V'），不是第一行。
          # 本地实测过一次，版本号被读成 "V"，白红一次。
          $line = (Get-Content 'engine/_version.py' | Where-Object { $_ -match '^VERSION\s*=' } | Select-Object -First 1)
          $ver = [regex]::Match($line, '"([^"]+)"').Groups[1].Value
          if (-not $ver) { Write-Host "::error::读不出 engine/_version.py 的 VERSION"; exit 1 }
          if ("$env:GITHUB_REF".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $expect = $tag -replace '^v', ''
            if ($ver -ne $expect) {
              Write-Host "::error::tag $tag 与 engine/_version.py 的 VERSION=$ver 不一致"
              Write-Host "::error::exe 与 APK 会拿到两个不同的版本号，这一版不能发。"
              Write-Host "::error::改 engine/_version.py 为 $expect 后重新打 tag。"
              exit 1
            }
            Write-Host "版本一致：$ver"
          } else {
            Write-Host "非 tag 构建，跳过比对（版本 $ver）"
          }

      - name: 装打包依赖
        run: |
          python -m pip install --upgrade pip
          # PyInstaller 锁版本：本地验过的是 6.22.3。不锁的话上游发新版就可能
          # 在 CI 上手搓出一份本地没验过的包 —— 那种包能编译、双击才崩。
          python -m pip install pyinstaller==6.22.3 pywebview pygame-ce pillow

      # 发行版 editor.exe 里没有 PyInstaller，编辑器内「打包游戏」靠这份预构建模板。
      # 漏了它，用户点打包就报错 —— 而且编译本身不会提醒。
      #
      # 这一步在 CI 上第一次跑就红过（v1.2.34），而本地 3.13 能过，说明是环境差异。
      # 所以这里把环境与失败尾巴都灌进 ::error:: —— Actions 日志要 admin 权限才读得到，
      # 但 annotation 是公开能取的，失败原因必须留在 annotation 里，否则下一轮还是瞎猜。
      - name: 构建玩家模板
        shell: pwsh
        run: |
          Write-Host "python: $(python -V 2>&1)"
          Write-Host "pyinstaller: $(python -m PyInstaller --version 2>&1)"
          Write-Host "pygame: $(python -c 'import pygame; print(pygame.version.ver)' 2>&1)"
          $out = (& python tools/build_player_template.py *>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 6) -join ' ⏎ '
            if ($tail.Length -gt 800) { $tail = $tail.Substring($tail.Length - 800) }
            Write-Host "::error::玩家模板构建失败，退出码 $LASTEXITCODE。尾巴：$tail"
            exit 1
          }
          $tpl = "engine\templates\player"
          if (-not (Test-Path "$tpl\MYONLPlayer.exe")) { Write-Host "::error::模板里没有 MYONLPlayer.exe"; exit 1 }

      - name: 打编辑器（PyInstaller onedir，用仓库 editor.spec）
        run: python -m PyInstaller --noconfirm --clean editor.spec

      # 冒烟：exe 存在且不是 0 字节；onedir 的关键运行时文件也都在。
      # 只看「编译成功」不够 —— 少了 _internal 里某个 dll，编译也是绿的，双击才崩。
      - name: 产物自检
        shell: pwsh
        run: |
          $exe = "dist\editor\editor.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::没生成 $exe"; exit 1 }
          $size = (Get-Item $exe).Length
          if ($size -lt 100000) { Write-Host "::error::editor.exe 只有 $size 字节，明显不对"; exit 1 }
          Write-Host "editor.exe $size 字节"
          $internal = Get-ChildItem "dist\editor\_internal" -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host "_internal $($internal.Count) 个文件 / $([math]::Round($internal.Sum/1MB,1)) MB"
          if ($internal.Count -lt 50) { Write-Host "::error::_internal 文件太少，运行时没打进去"; exit 1 }
          # 玩家模板必须躺在 exe 同级的 engine/templates/player 里
          # 没有它，发行版里「打包游戏」按钮必然报错 —— 那种包发出去等于发了个残废。
          $plt = "dist\editor\_internal\engine\templates\player\MYONLPlayer.exe"
          if (-not (Test-Path $plt)) { Write-Host "::error::玩家模板没进包，编辑器内「打包游戏」会坏"; exit 1 }
          Write-Host "玩家模板已进包"

      # Compress-Archive **不会**替你建目标目录：out\ 不存在时它直接报
      # 「path ... does not exist or is not a valid file system path」。
      # v1.2.37 的 exe 已经编译成功、自检也过了，就死在这一行没建目录（本地复现过）。
      - name: 压成 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $name = "MYONL-${{ github.ref_name }}-editor-win.zip"
          Compress-Archive -Path "dist\editor\*" -DestinationPath "out\$name" -CompressionLevel Optimal -ErrorAction Stop
          $zip = Get-Item "out\$name"
          Write-Host "$($zip.Name) $($zip.Length) 字节"
          # 100MB 级的 onedir 压完至少几十 MB；小于 5MB 说明只压进了个空壳。
          if ($zip.Length -lt 5000000) { Write-Host "::error::zip 只有 $($zip.Length) 字节，明显没打全"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: myonl-exe
          path: out/*.zip
          if-no-files-found: error

      # 同一个 tag 的 Release 由 android-apk.yml 先建或先建都行：
      # softprops 是按 tag 找 Release 再追加资产，幂等，不会互相覆盖。
      #
      # name / body 必须与 android-apk.yml **逐字一致**：两条流水线谁后跑完谁覆盖文案，
      # 写得不一样就会来回翻烧饼（以前这边写「安卓包」、那边写别的，页面上标题随机变）。
      - name: 把 exe 挂到同一个 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "MYONL ${{ github.ref_name }}（安卓 APK + Windows exe）"
          body: |
            **这一版两个包一起发，版本号一致（${{ github.ref_name }}）：**

            | 下载 | 装在哪 | 怎么用 |
            |---|---|---|
            | `MYONL-${{ github.ref_name }}.apk`（约 4.3 MB） | 安卓 7.0+ 手机 / 平板 | 传进手机，允许「未知来源」安装即可 |
            | `MYONL-${{ github.ref_name }}-editor-win.zip`（约 46 MB） | Windows 10/11 | 解压后双击 `editor.exe`，不用装 Python |

            装上打开就是**编辑器**：新建作品、写剧本、存本机、随时导出带走（不上云，不需要联网）。

            - **两端作品互通**：导出成 `.myonl`（剧本 + 它用到的素材，一个文件），手机导的电脑能导进去接着改，反过来也行。`.gal` 仍是纯剧本文本。
            - **版本号只有一个来源**（`engine/_version.py`），CI 校验 git tag 与它一致，不一致直接红 —— 不会再出现两端版本号对不上。
            - 覆盖安装不会丢档（签名固定）；**卸载**才会清空你的作品。
            - 手机上能写完一整部：写剧本、放素材、预览、导出成品、打成 APK 都在手机里完成，不用电脑。只有 3 条指令（`@anim` `@plug` `@include`）手机端还写不了，会红字指出第几行；其中 `@anim` `@include` 的成品在手机上能演，`@plug` 两头都没有。
            - **大屏已适配**：大屏手机、折叠屏展开、平板横竖屏走同一套手机界面，作品列数随宽度自适应（手机 1 列 / 平板竖 2 列 / 平板横 3 列）。13 档尺寸 × 6 个页面实测过触控目标、横向溢出与文字截断。
            - 竖屏横屏都支持，转屏自动重排。返回键按层级退：试玩层开着先关试玩、在编辑器里回作品列表、游戏里开菜单、在存档/设置子页先回菜单；只有在作品列表或游戏标题页按返回才是退出应用。
            - **已知限制**：安卓 WebView 弹不出系统文件选择器，所以手机上导入走「粘贴内容」那条路；电脑端导出 `.myonl` 暂不带视频（桌面视频是帧序列）。
            - 标题页、开场动画、玩家向的新手关卡都还没有。两个自带示例是给开发看的，不是教程。
          files: out/*.zip
          fail_on_unmatched_files: true
