name: 安卓 APK

# 自建 WebView 壳 + 固定签名，不依赖 node / 第三方壳框架。
# 触发：Actions 页面手动跑，或推版本 tag。
# v1 起 tag 名就是版本号（v1.0.0），apk-* 留着兼容旧包与旧链接。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "apk-*"

# 发 Release 要写权限
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK（用 runner 自带的那套）
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: 打两个单文件（编辑器 / 内置游戏）
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pillow pygame-ce
          mkdir -p android/app/src/main/assets
          # index.html = 编辑器：装上就能在手机上新建作品、写剧本、存本机、导出 .gal
          python3 tools/build_editor_single.py
          cp dist/web/editor-single.html android/app/src/main/assets/index.html
          # 播放器内核三个脚本要和 index.html 同级：手机端「做成成品」按钮
          # 在本地 fetch 它们拼单文件 HTML，拿不到就出不了成品。
          cp web/myonl-core.js web/myonl-layout.js web/myonl-player.js android/app/src/main/assets/
          # game.html = 内置成品：想直接玩的话从这里进
          python3 -c "from engine.webpack import build_single; build_single('games/研修日志', 'android/app/src/main/assets/game.html', title='研修日志')"
          ls -lh android/app/src/main/assets/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 打 release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/MYONL-${GITHUB_REF_NAME:-manual}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: myonl-apk
          path: out/*.apk
          if-no-files-found: error

      # 挂到 Release，这样不登录 GitHub 也能点下来直接装
      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "MYONL 安卓包 ${{ github.ref_name }}"
          body: |
            直接装：下载下面的 .apk（约 3.7 MB）传进手机，允许"未知来源"安装即可。

            装上打开就是**编辑器**：新建作品、写剧本、存本机、随时把 `.gal` 导出带走（不上云，不需要联网）。

            - 覆盖安装不会丢档（签名固定）；**卸载**才会清空你的作品。
            - 手机上先写剧本，成品打包交给电脑（`.gal` 用数据线拷过去，一条命）——手机做后台解析还需要把解析器搬成 JS，这一版没做。
            - 竖屏横屏都支持，转屏自动重排；返回键先关面板、再开菜单、最后才退出。
          files: out/*.apk
          fail_on_unmatched_files: true

      # 旧包自动清：Releases 页面上堆一串 apk-1..apk-N，玩家根本分不清哪个能装。
      # 只保留最近 3 个（按 tag 数字，apk-10 要排在 apk-9 前面 —— 字符串排序会排错），
      # 删 Release 时连 tag 一起删，否则 tag 还在、下次又像"新包"。
      # 留 3 个是"够回退、又不至于让人挑花眼"：再多就全是些存档还没修好的旧包。
      # 本步失败不影响已经发好的包（放在最后，且不把 job 判红）。
      - name: 只保留最近 3 个安卓包
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          KEEP=3
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName -q '.[].tagName' | grep -E '^apk-[0-9]+$' | sort -t- -k2 -n -r)
          n=${#tags[@]}
          echo "现在有 $n 个 apk Release，保留最近 $KEEP 个"
          if [ "$n" -le "$KEEP" ]; then
            echo "不用删"
            exit 0
          fi
          for ((i=KEEP; i<n; i++)); do
            t="${tags[$i]}"
            echo "删除旧包 $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "删 $t 失败，跳过"
          done
          echo "清理完成"

