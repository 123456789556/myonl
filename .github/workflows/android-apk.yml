name: 安卓 APK

# 自建 WebView 壳 + 固定签名，不依赖 node / 第三方壳框架。
# 触发：Actions 页面手动跑，或推 apk-* 标签。
on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 补 SDK 平台（runner 通常已自带，缺了就装）
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: 生成单文件 HTML（素材全内嵌）
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pillow pygame-ce
          mkdir -p android/app/src/main/assets
          python3 -c "from engine.webpack import build_single; build_single('games/研修日志', 'android/app/src/main/assets/index.html', title='研修日志')"
          ls -lh android/app/src/main/assets/index.html

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 打 release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 收产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/MYONL-${GITHUB_REF_NAME:-manual}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: myonl-apk
          path: out/*.apk
          if-no-files-found: error
