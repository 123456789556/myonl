name: 安卓 APK

# 自建 WebView 壳 + 固定签名，不依赖 node / 第三方壳框架。
# 触发：Actions 页面手动跑，或推版本 tag。
# v1 起 tag 名就是版本号（v1.0.0），apk-* 留着兼容旧包与旧链接。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "apk-*"

# 发 Release 要写权限
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK（用 runner 自带的那套）
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: 打两个单文件（编辑器 / 内置游戏）
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pillow pygame-ce
          mkdir -p android/app/src/main/assets
          # index.html = 编辑器：装上就能在手机上新建作品、写剧本、存本机、导出 .gal
          python3 tools/build_editor_single.py
          cp dist/web/editor-single.html android/app/src/main/assets/index.html
          # 播放器内核三个脚本要和 index.html 同级：手机端「做成成品」按钮
          # 在本地 fetch 它们拼单文件 HTML，拿不到就出不了成品。
          cp web/myonl-core.js web/myonl-layout.js web/myonl-player.js android/app/src/main/assets/
          # game.html = 内置示例：装上就能直接玩一关，也用来证明素材能显示
          python3 -c "from engine.webpack import build_single; build_single('games/newbie_demo', 'android/app/src/main/assets/game.html', title='新手示例')"
          ls -lh android/app/src/main/assets/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 推出版本号（tag 走语义码；手动/分支构建走运行号）
        run: |
          # v1.1.0 -> 名称 1.1.0、代码 10100；不是 v 开头的 tag（apk-xx 之类）退回 1
          RAW="$GITHUB_REF_NAME"
          VER="${RAW#v}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJ=$(echo "$VER" | cut -d. -f1)
            MIN=$(echo "$VER" | cut -d. -f2)
            PAT=$(echo "$VER" | cut -d. -f3)
            CODE=$((MAJ * 10000 + MIN * 100 + PAT))
            echo "MYONL_VERSION_NAME=$VER" >> "$GITHUB_ENV"
            echo "MYONL_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
            echo "版本名 $VER / 版本代码 $CODE（tag 发版路径）"
          else
            # P136：workflow_dispatch / 分支构建以前不注入 versionCode，gradle 兜底恒为 1，
            # 每个手动包系统都当同一版，覆盖安装行为不可控、也分不出新旧。
            # 用 GITHUB_RUN_NUMBER（同一仓库单调递增、不回退）当 versionCode；
            # 与 tag 语义码不冲突：tag 码在 10000 量级起，运行号从 1 往上，发版路径优先走上面分支。
            CODE="${GITHUB_RUN_NUMBER:-1}"
            echo "MYONL_VERSION_NAME=0.0.0-dev.$CODE" >> "$GITHUB_ENV"
            echo "MYONL_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
            echo "非 tag 构建：版本代码 $CODE（运行号）"
          fi

      # 先查 secret 齐不齐，缺就当场停。
      # 以前是打到 apksigner 校验才红 —— 那时已经编译了 20 分钟，白等。
      - name: 检查签名 secret 是否齐全
        env:
          MYONL_KEYSTORE_B64: ${{ secrets.MYONL_KEYSTORE_B64 }}
          MYONL_STORE_PASS: ${{ secrets.MYONL_STORE_PASS }}
          MYONL_KEY_PASS: ${{ secrets.MYONL_KEY_PASS }}
        run: |
          missing=""
          [ -z "${MYONL_KEYSTORE_B64}" ] && missing="$missing MYONL_KEYSTORE_B64"
          [ -z "${MYONL_STORE_PASS}" ]   && missing="$missing MYONL_STORE_PASS"
          [ -z "${MYONL_KEY_PASS}" ]     && missing="$missing MYONL_KEY_PASS"
          if [ -n "$missing" ]; then
            echo "::error::缺签名 secret:$missing"
            echo "::error::去 Settings → Secrets and variables → Actions 补齐这三条。"
            echo "::error::没有它们，包签不了名，装上会被 Android 直接拒绝（解析失败）。"
            echo "::error::所以在这里停，不白编译 20 分钟。"
            exit 1
          fi
          echo "三条签名 secret 都在"

      - name: 还原签名私钥（从 repository secret）
        env:
          MYONL_KEYSTORE_B64: ${{ secrets.MYONL_KEYSTORE_B64 }}
          MYONL_STORE_PASS: ${{ secrets.MYONL_STORE_PASS }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$MYONL_KEYSTORE_B64" | base64 -d > android/keystore/myonl-test.p12
          SIZE=$(stat -c%s android/keystore/myonl-test.p12)
          echo "私钥已还原（${SIZE} 字节）"
          # 日志接口要管理员权限才读得到，所以把关键事实写成注解：
          # 注解是公开可读的，出问题时不用求人也能看到真相。
          echo "::notice::p12 还原 ${SIZE} 字节（本地备份是 2574 字节）"
          KEYTOOL="${JAVA_HOME}/bin/keytool"
          [ -x "$KEYTOOL" ] || KEYTOOL="$(command -v keytool || true)"
          if [ -n "$KEYTOOL" ]; then
            "$KEYTOOL" -list -keystore android/keystore/myonl-test.p12 \
              -storetype PKCS12 -storepass "$MYONL_STORE_PASS" 2>&1 | head -12 | \
              while IFS= read -r line; do echo "::notice::keytool: ${line}"; done
          else
            echo "::warning::找不到 keytool，跳过硬证书自检"
          fi

      - name: 打 release APK
        working-directory: android
        env:
          MYONL_STORE_PASS: ${{ secrets.MYONL_STORE_PASS }}
          MYONL_KEY_PASS: ${{ secrets.MYONL_KEY_PASS }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log; then
            echo "::error::gradle 失败，摘取关键段落进注解（完整日志在 job 日志里）"
            grep -n -E "What went wrong|Caused by:|^> Task .*FAILED|error:|FAILURE: Build|Unsupported|Could not|not found" \
              -A 3 /tmp/gradle.log 2>/dev/null | head -50 | \
              while IFS= read -r line; do echo "::error::${line//%/%%}"; done
            exit 1
          fi

      - name: 收产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/MYONL-${GITHUB_REF_NAME:-manual}.apk"
          ls -lh out

      # 没签名的包装不上。与其让人下载一个点不开的文件，不如这里就红。
      # 以前这一步不存在，签名的兜底密码就写在 build.gradle 里 —— 出包永远成功，
      # 代价是私钥公开。现在兜底没了，缺 secret 就会走到这条上。
      - name: 确认包签过名
        run: |
          APK="out/MYONL-${GITHUB_REF_NAME:-manual}.apk"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)"
          if [ -z "$SIGNER" ]; then
            echo "::error::找不到 apksigner，没法校验签名"
            exit 1
          fi
          if "$SIGNER" verify --print-certs "$APK"; then
            echo "签名正常"
          else
            echo "::error::这个包没有有效签名，装不上，不能发出去"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: myonl-apk
          path: out/*.apk
          if-no-files-found: error

      # 挂到 Release，这样不登录 GitHub 也能点下来直接装
      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "MYONL 安卓包 ${{ github.ref_name }}"
          body: |
            直接装：下载下面的 .apk（约 3.7 MB）传进手机，允许"未知来源"安装即可。

            装上打开就是**编辑器**：新建作品、写剧本、存本机、随时把 `.gal` 导出带走（不上云，不需要联网）。

            - 覆盖安装不会丢档（签名固定）；**卸载**才会清空你的作品。
            - 手机上先写剧本，成品打包交给电脑（`.gal` 用数据线拷过去，一条命）——手机做后台解析还需要把解析器搬成 JS，这一版没做。
            - 竖屏横屏都支持，转屏自动重排；返回键先关面板、再开菜单、最后才退出。
          files: out/*.apk
          fail_on_unmatched_files: true

      # 旧包自动清：Releases 页面上堆一串 apk-1..apk-N，玩家根本分不清哪个能装。
      # 只保留最近 3 个（按 tag 数字，apk-10 要排在 apk-9 前面 —— 字符串排序会排错），
      # 删 Release 时连 tag 一起删，否则 tag 还在、下次又像"新包"。
      # 留 3 个是"够回退、又不至于让人挑花眼"：再多就全是些存档还没修好的旧包。
      # 本步失败不影响已经发好的包（放在最后，且不把 job 判红）。
      - name: 只保留最近 3 个安卓包
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          KEEP=3
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName -q '.[].tagName' | grep -E '^apk-[0-9]+$' | sort -t- -k2 -n -r)
          n=${#tags[@]}
          echo "现在有 $n 个 apk Release，保留最近 $KEEP 个"
          if [ "$n" -le "$KEEP" ]; then
            echo "不用删"
            exit 0
          fi
          for ((i=KEEP; i<n; i++)); do
            t="${tags[$i]}"
            echo "删除旧包 $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "删 $t 失败，跳过"
          done
          echo "清理完成"

