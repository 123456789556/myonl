<?xml version="1.0" encoding="UTF-8"?>
<!-- 眼睛跟随组件 · 三态演示（左看 / 正视 / 右看）
     组件参数契约（桌宠眼睛组件化）：
       eye-white   眼白椭圆 rx=115 ry=125（限位容器）
       iris        虹膜 r=64 深空蓝渐变
       pupil       瞳孔 r=30
       highlight   双高光（主 r=13 / 副 r=5.5）
       travel      瞳孔最大偏移域 ±34px（贝塞尔轨迹弧标示平滑限位）
     配色：与 MYONL 品牌同源（深空蓝 #2A3059 / 星光金 #FFE066）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <radialGradient id="etIris" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#4A5AA8"/>
      <stop offset="55%" stop-color="#2A3059"/>
      <stop offset="100%" stop-color="#161B33"/>
    </radialGradient>
    <linearGradient id="etBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232A4A"/>
      <stop offset="100%" stop-color="#3A3264"/>
    </linearGradient>
    <radialGradient id="etWhite" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3D6"/>
    </radialGradient>
  </defs>

  <!-- 三格底板 -->
  <rect x="10"  y="10" width="373" height="380" rx="40" fill="url(#etBg)"/>
  <rect x="413" y="10" width="373" height="380" rx="40" fill="url(#etBg)"/>
  <rect x="816" y="10" width="373" height="380" rx="40" fill="url(#etBg)"/>

  <!-- ========== 1 · 左看（瞳孔 -34px 限位） ========== -->
  <g transform="translate(196,195)">
    <ellipse cx="0" cy="0" rx="115" ry="125" fill="url(#etWhite)" stroke="#F5C966" stroke-width="3"/>
    <path d="M -100 -78 Q 0 -138 100 -78" fill="none" stroke="#2A3059" stroke-width="7" stroke-linecap="round"/>
    <path d="M -34 0 Q 0 -12 34 0" fill="none" stroke="#F5C966" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-34" cy="0" r="3" fill="#F5C966"/>
    <circle cx="0" cy="-12" r="3" fill="#F5C966"/>
    <circle cx="34" cy="0" r="3" fill="#F5C966"/>
    <circle cx="-34" cy="0" r="64" fill="url(#etIris)"/>
    <circle cx="-34" cy="0" r="30" fill="#0F1330"/>
    <circle cx="-50" cy="-18" r="13" fill="#FFFFFF"/>
    <circle cx="-16" cy="20" r="5.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-58" cy="30" r="2.5" fill="#FFE066" opacity="0.8"/>
  </g>

  <!-- ========== 2 · 正视（居中基准态） ========== -->
  <g transform="translate(600,195)">
    <ellipse cx="0" cy="0" rx="115" ry="125" fill="url(#etWhite)" stroke="#F5C966" stroke-width="3"/>
    <path d="M -100 -78 Q 0 -138 100 -78" fill="none" stroke="#2A3059" stroke-width="7" stroke-linecap="round"/>
    <path d="M -34 0 Q 0 -12 34 0" fill="none" stroke="#F5C966" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-34" cy="0" r="3" fill="#F5C966"/>
    <circle cx="0" cy="-12" r="3" fill="#F5C966"/>
    <circle cx="34" cy="0" r="3" fill="#F5C966"/>
    <circle cx="0" cy="0" r="64" fill="url(#etIris)"/>
    <circle cx="0" cy="0" r="30" fill="#0F1330"/>
    <circle cx="-16" cy="-18" r="13" fill="#FFFFFF"/>
    <circle cx="18" cy="20" r="5.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-24" cy="30" r="2.5" fill="#FFE066" opacity="0.8"/>
    <!-- 准星：正视基准 -->
    <g stroke="#FFE066" stroke-opacity="0.5" stroke-width="1.5">
      <line x1="0" y1="-160" x2="0" y2="-146"/>
      <line x1="0" y1="146" x2="0" y2="160"/>
    </g>
  </g>

  <!-- ========== 3 · 右看（瞳孔 +34px 限位） ========== -->
  <g transform="translate(1004,195)">
    <ellipse cx="0" cy="0" rx="115" ry="125" fill="url(#etWhite)" stroke="#F5C966" stroke-width="3"/>
    <path d="M -100 -78 Q 0 -138 100 -78" fill="none" stroke="#2A3059" stroke-width="7" stroke-linecap="round"/>
    <path d="M -34 0 Q 0 -12 34 0" fill="none" stroke="#F5C966" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-34" cy="0" r="3" fill="#F5C966"/>
    <circle cx="0" cy="-12" r="3" fill="#F5C966"/>
    <circle cx="34" cy="0" r="3" fill="#F5C966"/>
    <circle cx="34" cy="0" r="64" fill="url(#etIris)"/>
    <circle cx="34" cy="0" r="30" fill="#0F1330"/>
    <circle cx="18" cy="-18" r="13" fill="#FFFFFF"/>
    <circle cx="52" cy="20" r="5.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="10" cy="30" r="2.5" fill="#FFE066" opacity="0.8"/>
  </g>

  <!-- 底部星尘装饰 -->
  <g fill="#FFE066" opacity="0.6">
    <circle cx="60" cy="352" r="2"/>
    <circle cx="1140" cy="48" r="2.4"/>
    <circle cx="600" cy="360" r="1.8"/>
  </g>
</svg>
