<?xml version="1.0" encoding="UTF-8"?>
<!-- MYONL 横版字母图标（图标 + MYONL 字标横排组合）
     场景：启动器标题栏 / 窗口 Header / 官网顶部 / 关于页
     构成：左 = V3 定稿图标核心（满月 O + Y + 金新月），右 = MYONL 五字母字标
     配色与 moyul_icon.svg / moyul_wordmark.svg 完全一致（同源复用）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="lkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D2342"/>
      <stop offset="55%" stop-color="#2A3059"/>
      <stop offset="100%" stop-color="#5A4E8C"/>
    </linearGradient>
    <radialGradient id="lkMoon" cx="42%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="60%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFE9B8"/>
    </radialGradient>
    <radialGradient id="lkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FFE066" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lkCrescent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F5B84C"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="8" y="8" width="1184" height="384" rx="72" fill="url(#lkBg)"/>
  <ellipse cx="600" cy="90" rx="480" ry="70" fill="#FFFFFF" opacity="0.05"/>

  <!-- 背景星光（极简） -->
  <g fill="#FFE066">
    <path d="M 1116 66 l 2.6 6.5 6.5 2.6 -6.5 2.6 -2.6 6.5 -2.6 -6.5 -6.5 -2.6 6.5 -2.6 Z" opacity="0.9"/>
    <circle cx="84" cy="330" r="2.6" opacity="0.55"/>
    <circle cx="1122" cy="300" r="2" opacity="0.4"/>
  </g>

  <!-- ========== 左：图标核心（满月 O + Y + 金新月，源自 moyul_icon.svg 平移缩放） ========== -->
  <g transform="translate(205,200) scale(0.86) translate(-256,-256)">
    <circle cx="170" cy="240" r="132" fill="url(#lkGlow)"/>
    <circle cx="170" cy="240" r="96" fill="url(#lkMoon)"/>
    <circle cx="140" cy="216" r="12" fill="#F0D9A8" opacity="0.35"/>
    <circle cx="196" cy="268" r="8"  fill="#F0D9A8" opacity="0.25"/>
    <circle cx="186" cy="200" r="5"  fill="#F0D9A8" opacity="0.2"/>
    <line x1="316" y1="152" x2="390" y2="266" stroke="#FFF7E6" stroke-width="36" stroke-linecap="round"/>
    <line x1="438" y1="152" x2="390" y2="266" stroke="#FFF7E6" stroke-width="36" stroke-linecap="round"/>
    <line x1="390" y1="266" x2="390" y2="384" stroke="#FFF7E6" stroke-width="36" stroke-linecap="round"/>
    <path d="M 316 92 A 62 62 0 0 0 392 154 A 45 45 0 0 1 316 92 Z" fill="url(#lkCrescent)"/>
  </g>

  <!-- 分隔微光竖线 -->
  <line x1="408" y1="92" x2="408" y2="308" stroke="#FFE066" stroke-opacity="0.25" stroke-width="2"/>

  <!-- ========== 右：MYONL 字标（源自 moyul_wordmark.svg，缩放 0.78） ========== -->
  <g transform="translate(438,72) scale(0.78)">
    <!-- M -->
    <polyline points="50,230 50,70 100,160 150,70 150,230"
              fill="none" stroke="#FFF7E6" stroke-width="30"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- O · 满月 -->
    <circle cx="255" cy="150" r="104" fill="url(#lkGlow)"/>
    <circle cx="255" cy="150" r="80" fill="url(#lkMoon)"/>
    <circle cx="232" cy="130" r="10" fill="#F0D9A8" opacity="0.35"/>
    <circle cx="276" cy="172" r="6.5" fill="#F0D9A8" opacity="0.25"/>
    <circle cx="268" cy="118" r="4" fill="#F0D9A8" opacity="0.2"/>
    <!-- Y + 金新月 -->
    <line x1="390" y1="70" x2="440" y2="150" stroke="#FFF7E6" stroke-width="30" stroke-linecap="round"/>
    <line x1="494" y1="70" x2="440" y2="150" stroke="#FFF7E6" stroke-width="30" stroke-linecap="round"/>
    <line x1="440" y1="150" x2="440" y2="230" stroke="#FFF7E6" stroke-width="30" stroke-linecap="round"/>
    <path d="M 518 34 A 40 40 0 0 0 568 76 A 29 29 0 0 1 518 34 Z" fill="url(#lkCrescent)"/>
    <!-- U -->
    <path d="M 585 70 L 585 170 A 40 40 0 0 0 665 170 L 665 70"
          fill="none" stroke="#FFF7E6" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- L -->
    <polyline points="735,70 735,230 810,230"
              fill="none" stroke="#FFF7E6" stroke-width="30"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
