<?xml version="1.0" encoding="UTF-8"?>
<!-- MYONL 应用图标 · 极简字母月方案（定稿：V3 点月式，用户 2026-10-29 拍板）
     概念：MYONL 字标中取 "OY" 合体为图标符号 —— O = 满月（发光），Y = 月白几何字形，
           满月右上方坐一弯金色新月（满月+新月双月呼应）
     配色：深空蓝紫渐变底板 + 月白字形 + 星光金新月
     场景：应用商店 / 任务栏 / 桌面快捷方式 / 编辑器插件；16px 仍可辨识（亮圆 + 金弧）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 底板：深空蓝 → 紫 对角渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D2342"/>
      <stop offset="55%" stop-color="#2A3059"/>
      <stop offset="100%" stop-color="#5A4E8C"/>
    </linearGradient>
    <!-- 满月：月白径向渐变 -->
    <radialGradient id="moonGrad" cx="42%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="60%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFE9B8"/>
    </radialGradient>
    <!-- 满月外发光晕 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FFE066" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 月牙臂：星光金渐变 -->
    <linearGradient id="crescentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F5B84C"/>
    </linearGradient>
  </defs>

  <!-- ========== 底板（圆角方） ========== -->
  <rect x="16" y="16" width="480" height="480" rx="114" fill="url(#bgGrad)"/>
  <!-- 顶部玻璃微光（极简一层） -->
  <ellipse cx="256" cy="120" rx="200" ry="80" fill="#FFFFFF" opacity="0.05"/>

  <!-- ========== 星光点缀（深空氛围，极简 3 颗） ========== -->
  <g fill="#FFE066">
    <path d="M 440 74 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z" opacity="0.9"/>
    <circle cx="92" cy="400" r="3" opacity="0.55"/>
    <circle cx="446" cy="336" r="2.2" opacity="0.4"/>
  </g>

  <!-- ========== O · 满月 ========== -->
  <!-- 光晕 -->
  <circle cx="170" cy="240" r="132" fill="url(#glowGrad)"/>
  <!-- 月盘 -->
  <circle cx="170" cy="240" r="96" fill="url(#moonGrad)"/>
  <!-- 环形山（极淡，保持极简） -->
  <circle cx="140" cy="216" r="12" fill="#F0D9A8" opacity="0.35"/>
  <circle cx="196" cy="268" r="8"  fill="#F0D9A8" opacity="0.25"/>
  <circle cx="186" cy="200" r="5"  fill="#F0D9A8" opacity="0.2"/>

  <!-- ========== Y · 月白几何字形 + 新月伴月（V3 点月式） ========== -->
  <!-- Y 左臂 / 右臂 / 竖笔（月白圆头） -->
  <line x1="316" y1="152" x2="390" y2="266" stroke="#FFF7E6" stroke-width="36" stroke-linecap="round"/>
  <line x1="438" y1="152" x2="390" y2="266" stroke="#FFF7E6" stroke-width="36" stroke-linecap="round"/>
  <line x1="390" y1="266" x2="390" y2="384" stroke="#FFF7E6" stroke-width="36" stroke-linecap="round"/>
  <!-- 金色新月：位于满月右上方，凹面朝左下（环抱满月之势），两尖朝右上 -->
  <path d="M 316 92 A 62 62 0 0 0 392 154 A 45 45 0 0 1 316 92 Z" fill="url(#crescentGrad)"/>

</svg>
