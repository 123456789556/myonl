<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MYONL · 图标 MY 干净版</title>
<style>
  body { margin: 0; background: linear-gradient(165deg, #0B1030 0%, #171B4E 50%, #2A1B5E 100%); font-family: Arial, "Microsoft YaHei", sans-serif; color: #E8E4FF; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 28px; }
  h1 { font-size: 21px; letter-spacing: 2px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #9A93C9; margin-bottom: 34px; }
  .row { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
  .card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 18px; width: 320px; }
  .stage { display: flex; justify-content: center; align-items: center; height: 270px; border-radius: 12px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; color: #C9B8FF; }
  .card p { margin: 0; font-size: 12.5px; color: #B9B2DE; line-height: 1.6; }
  .tag { display: inline-block; background: rgba(124,107,255,0.18); border: 1px solid rgba(124,107,255,0.4); color: #D9D2FF; border-radius: 20px; padding: 2px 10px; font-size: 11.5px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MYONL · 图标 MY 干净版</h1>
  <div class="sub">应用图标 · 主体 MY 两字母 · 极淡光晕 · 星星独立不贴主体 · Trae 式干净</div>
  <div class="row">

    <!-- A: MY + 右上独立星 -->
    <div class="card">
      <div class="stage" style="background: radial-gradient(circle at 50% 45%, rgba(124,107,255,0.18), rgba(11,16,48,0.0) 62%);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
          <defs>
            <linearGradient id="sqA2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#26348A"/><stop offset="100%" stop-color="#452B94"/>
            </linearGradient>
            <linearGradient id="myA2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DCD5FF"/>
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="204" height="204" rx="46" fill="url(#sqA2)"/>
          <rect x="8" y="8" width="204" height="204" rx="46" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
          <text x="110" y="122" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="url(#myA2)" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">MY</text>
          <path d="M 176 46 l 4.5 4.5 l -4.5 4.5 l -4.5 -4.5 z" fill="#FFE9A8"/>
        </svg>
      </div>
      <span class="tag">版 A · MY + 右上独立星</span>
      <h3>MY 居中 + 单星独立</h3>
      <p>深蓝紫干净渐变底，中央 MY 两字母（白→淡紫渐变），右上角一颗独立小星（不贴字母），几乎无光环。</p>
    </div>

    <!-- B: MY + 顶部星 + 底部小字 -->
    <div class="card">
      <div class="stage" style="background: radial-gradient(circle at 50% 42%, rgba(124,107,255,0.16), rgba(11,16,48,0.0) 60%);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
          <defs>
            <linearGradient id="sqB2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#1E2C74"/><stop offset="100%" stop-color="#3A2E8C"/>
            </linearGradient>
            <linearGradient id="myB2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#E4E0FF"/>
            </linearGradient>
          </defs>
          <rect x="8" y="8" width="204" height="204" rx="46" fill="url(#sqB2)"/>
          <rect x="8" y="8" width="204" height="204" rx="46" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
          <path d="M 110 44 l 3.6 3.6 l -3.6 3.6 l -3.6 -3.6 z" fill="#FFE9A8"/>
          <text x="110" y="126" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="url(#myB2)" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">MY</text>
          <text x="110" y="182" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#BDB6E6" text-anchor="middle" dominant-baseline="middle" letter-spacing="7">MYONL</text>
        </svg>
      </div>
      <span class="tag">版 B · MY + 顶部星 + 底部 MYONL 小字</span>
      <h3>MY 居中 + 顶星 + 字标</h3>
      <p>对角渐变底，MY 为主，顶部独立小星，底部细字 MYONL（字距宽、半透淡紫），组合标感，小尺寸仍可辨。</p>
    </div>

  </div>
</div>
</body>
</html>
